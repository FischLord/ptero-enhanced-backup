name: Gateway image

on:
  push:
    tags:
      - "gateway-v*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/fischlord/peb-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # The integration tests skip themselves when restic is missing, so install it to run them.
      - name: Install restic
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends restic
      - name: go test
        working-directory: gateway
        run: go test ./... -race -count=1

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=gateway-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/gateway-v') }}
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      # gateway-vX.Y.Z -> X.Y.Z; other runs keep the default version from main.go.
      - id: ver
        run: |
          case "$GITHUB_REF" in
            refs/tags/gateway-v*) echo "version=${GITHUB_REF#refs/tags/gateway-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          context: gateway
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
